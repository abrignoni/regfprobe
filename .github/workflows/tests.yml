name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # python.org 3.14 on macOS ships Tk 9.0.3, which aborts on a window never shown;
          # the window test runs on 3.13 there (Tk 8.6).
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # python-registry is used by the tests only, as an independent reader to compare against.
      - run: python -m pip install --upgrade pip python-registry==1.3.1 pylint
      - name: Lint (convention and refactor messages off; every warning fails)
        run: python -m pylint regfprobe.py regfprobe_gui.py tools tests --disable=C,R
      - name: Install a virtual display for the window test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb
      - name: Run the tests (under a virtual display on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m unittest discover -s tests -v; else python -m unittest discover -s tests -v; fi
        env:
          REGFPROBE_REQUIRE_PYTHON_REGISTRY: "1"
          REGFPROBE_REQUIRE_GUI: "1"
          PYTHONIOENCODING: utf-8
