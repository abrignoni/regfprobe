name: unsigned builds

# Freezes the CLI and the window of a release tag with PyInstaller, checks each binary against
# the source it was frozen from, and keeps the results as workflow artifacts. Nothing is
# published from here: the binaries are attached to the release by hand after checking them.
# The builds are not code signed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build, e.g. v0.2.0
        required: true
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'tools/smoke_binary.py'

permissions:
  contents: read

env:
  PYINSTALLER: pyinstaller==6.22.3
  # the disk image readers bundled into both binaries, pinned by commit and hash
  QNXPROBE_COMMIT: e9122fa8ed147a9473afbad15f8f3f9e84e7c6a0
  QNXPROBE_SHA256: 266f5503a0d84224ff8135371ec557b730350498e22134fdfeb8c0a8632e4940
  EWFPROBE_COMMIT: 4af1a54a223edbce12693b29fb3838b63a26b4f2
  EWFPROBE_SHA256: 4169e397ee125591f4245791b5d7427ea3c2fd7b44e390a4a127a7548d39c2f6

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64, arch: x64}
          - {os: windows-11-arm, platform: windows-arm64, arch: arm64}
          # python.org 3.14 on macOS ships Tk 9.0.3, which aborts the window; 3.13 has Tk 8.6
          - {os: macos-latest, platform: macos-arm64, arch: arm64}
          - {os: macos-15-intel, platform: macos-x64, arch: x64}
          # 22.04 so the binaries run on older glibc than the newest runner image has
          - {os: ubuntu-22.04, platform: linux-x64, arch: x64}
          - {os: ubuntu-22.04-arm, platform: linux-arm64, arch: arm64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      # the smoke check comes from the workflow's own commit, which may be newer than the tag
      - uses: actions/checkout@v4
        with:
          path: _workflow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Tk and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb
      - name: The tag's files match its published checksums
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p SHA256SUMS.txt -D _sums
          python - <<'PY'
          import hashlib
          for line in open('_sums/SHA256SUMS.txt'):
              digest, name = line.split()
              actual = hashlib.sha256(open(name, 'rb').read()).hexdigest()
              print(name, 'ok' if actual == digest else 'DIFFERS')
              assert actual == digest, name
          PY
      - name: Fetch the image readers
        run: |
          mkdir _probes
          curl -sfL -o _probes/qnxprobe.py "https://raw.githubusercontent.com/abrignoni/qnxprobe/$QNXPROBE_COMMIT/qnxprobe.py"
          curl -sfL -o _probes/ewfprobe.py "https://raw.githubusercontent.com/abrignoni/ewfprobe/$EWFPROBE_COMMIT/ewfprobe.py"
          python - <<'PY'
          import hashlib, os
          for name, want in (('qnxprobe', os.environ['QNXPROBE_SHA256']), ('ewfprobe', os.environ['EWFPROBE_SHA256'])):
              got = hashlib.sha256(open(f'_probes/{name}.py', 'rb').read()).hexdigest()
              print(name, got)
              assert got == want, name
          PY
      # a venv holding only PyInstaller, so nothing optional on the runner is frozen in
      - name: Build environment
        run: |
          python -m venv _venv
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$PWD/_venv/Scripts" >> "$GITHUB_PATH"; else echo "$PWD/_venv/bin" >> "$GITHUB_PATH"; fi
      - name: Freeze
        run: |
          python -m pip install --upgrade pip "$PYINSTALLER"
          python -c "import sys, tkinter; print(sys.version, sys.platform, 'Tk', tkinter.TkVersion)"
          COMMON="--noconfirm --clean --paths _probes --hidden-import qnxprobe --hidden-import ewfprobe"
          python -m PyInstaller $COMMON --onefile --console --name regfprobe regfprobe.py
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m PyInstaller $COMMON --windowed --onedir --name regfprobe-window regfprobe_gui.py
          else
            python -m PyInstaller $COMMON --windowed --onefile --name regfprobe-window regfprobe_gui.py
          fi
          ls -la dist
      - name: Check the binaries against the source
        run: |
          VERSION=$(python regfprobe.py --version | cut -d' ' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Windows) CLI=dist/regfprobe.exe; GUI=dist/regfprobe-window.exe ;;
            macOS) CLI=dist/regfprobe; GUI=dist/regfprobe-window.app/Contents/MacOS/regfprobe-window ;;
            *) CLI=dist/regfprobe; GUI=dist/regfprobe-window ;;
          esac
          cp _workflow/tools/smoke_binary.py tools/smoke_binary.py
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN python tools/smoke_binary.py --cli "$CLI" --gui "$GUI" --version "$VERSION"
        env:
          PYTHONIOENCODING: utf-8
      - name: Package
        run: |
          mkdir _out _notices
          cp LICENSE _notices/LICENSE-regfprobe
          curl -sfL -o _notices/LICENSE-qnxprobe "https://raw.githubusercontent.com/abrignoni/qnxprobe/$QNXPROBE_COMMIT/LICENSE"
          curl -sfL -o _notices/LICENSE-ewfprobe "https://raw.githubusercontent.com/abrignoni/ewfprobe/$EWFPROBE_COMMIT/LICENSE"
          python - <<'PY'
          import glob, os, shutil, sys
          found = sorted(set(glob.glob(os.path.join(sys.base_prefix, 'LICENSE*'))
                             + glob.glob(os.path.join(sys.base_prefix, 'lib', 'python3*', 'LICENSE*'))
                             + glob.glob(os.path.join(sys.base_prefix, 'Lib', 'LICENSE*'))))
          print(found)
          assert found, 'no Python licence found under ' + sys.base_prefix
          shutil.copy(found[0], '_notices/LICENSE-python.txt')
          PY
          P="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/regfprobe.exe "_out/regfprobe-$VERSION-$P.exe"
            cp dist/regfprobe-window.exe "_out/regfprobe-window-$VERSION-$P.exe"
          else
            cp dist/regfprobe "_out/regfprobe-$VERSION-$P"
            chmod +x "_out/regfprobe-$VERSION-$P"
            if [ "$RUNNER_OS" = "macOS" ]; then
              ditto -c -k --keepParent dist/regfprobe-window.app "_out/regfprobe-window-$VERSION-$P.app.zip"
            else
              cp dist/regfprobe-window "_out/regfprobe-window-$VERSION-$P"
              chmod +x "_out/regfprobe-window-$VERSION-$P"
            fi
          fi
          cp _notices/* _out/
          ls -la _out
      - uses: actions/upload-artifact@v4
        with:
          name: regfprobe-${{ matrix.platform }}
          path: _out/*
          if-no-files-found: error
